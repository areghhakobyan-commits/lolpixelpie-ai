name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: pixelpie-macos
          - os: windows-latest
            script: dist:win
            artifact: pixelpie-windows
          - os: ubuntu-latest
            script: dist:linux
            artifact: pixelpie-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run ${{ matrix.script }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  collect-installers:
    name: Collect all platform installers
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers from all platform builds
        uses: actions/download-artifact@v4
        with:
          pattern: pixelpie-*
          path: all-installers
          merge-multiple: true

      - name: Upload combined installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixelpie-all-platform-installers
          path: all-installers/*
          if-no-files-found: error
          retention-days: 30
