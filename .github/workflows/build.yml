name: Build and release desktop apps

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: pixelpie-macos
            installer: dist/*.dmg
          - os: windows-latest
            script: dist:win
            artifact: pixelpie-windows
            installer: dist/*Setup*.exe
          - os: ubuntu-latest
            script: dist:linux
            artifact: pixelpie-linux
            installer: dist/*.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run ${{ matrix.script }}

      - name: Upload only the installer
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.installer }}
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish exactly three platform installers
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS installer
        uses: actions/download-artifact@v7
        with:
          name: pixelpie-macos
          path: release-assets

      - name: Download Windows installer
        uses: actions/download-artifact@v7
        with:
          name: pixelpie-windows
          path: release-assets

      - name: Download Linux installer
        uses: actions/download-artifact@v7
        with:
          name: pixelpie-linux
          path: release-assets

      - name: Verify exactly three installers
        run: |
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 3
          find release-assets -maxdepth 1 -type f -printf '%f\\n' | sort

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pixelpie-build-${{ github.run_number }}
          name: PixelPie AI build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: |
            release-assets/*.dmg
            release-assets/*Setup*.exe
            release-assets/*.AppImage
