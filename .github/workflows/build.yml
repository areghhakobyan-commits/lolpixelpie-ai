name: Build and release desktop apps

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: pixelpie-macos
          - os: windows-latest
            script: dist:win
            artifact: pixelpie-windows
          - os: ubuntu-latest
            script: dist:linux
            artifact: pixelpie-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run ${{ matrix.script }}

      - name: Upload platform installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish installers to GitHub Releases
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS installers
        uses: actions/download-artifact@v4
        with:
          name: pixelpie-macos
          path: release-assets/macos

      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: pixelpie-windows
          path: release-assets/windows

      - name: Download Linux installers
        uses: actions/download-artifact@v4
        with:
          name: pixelpie-linux
          path: release-assets/linux

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pixelpie-build-${{ github.run_number }}
          name: PixelPie AI build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: release-assets/**/*
